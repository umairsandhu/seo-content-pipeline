[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-content-pipeline"
version = "1.0.0"
description = "Site-agnostic SEO content pipeline: ingest any site + Google Search Console + DataForSEO into a prioritized content plan (cannibalization, gaps, striking-distance, low-CTR)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["seo", "content", "dataforseo", "search-console", "cannibalization"]
dependencies = ["numpy", "scikit-learn"]

[project.optional-dependencies]
gsc = ["google-api-python-client", "google-auth"]

[project.scripts]
seo-content-pipeline = "seo_agent.__main__:main"

[tool.setuptools]
packages = ["seo_agent"]
